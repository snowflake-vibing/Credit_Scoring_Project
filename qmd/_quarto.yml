project:
  type: book
  output-dir: _output

book:
  title: "Đề Tài 7: Mô Hình Chấm Điểm Tín Dụng & Thẩm Định Rủi Ro Vỡ Nợ"
  subtitle: "Báo Cáo Tiểu Luận Môn Học Dữ Liệu Lớn & Trí Tuệ Nhân Tạo Trong Kinh Doanh"
  author:
    - name: "Lê Thành Hiệu"
      affiliation: "Trường Đại học Kinh tế - Đại học Quốc gia"
  date: "2026"
  search: true
  chapters:
    - index.qmd
    - 01_CHUONG_1_GIOI_THIEU.qmd
    - 02_CHUONG_2_KIEN_TRUC.qmd
    - 03_CHUONG_3_XU_LY_DU_LIEU.qmd
    - 04_CHUONG_4_MO_HINH_AI.qmd
    - 05_CHUONG_5_KHUYEN_NGHI.qmd
    - 06_TAI_LIEU_THAM_KHAO.qmd

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-fold: show
    highlight-style: github
  pdf:
    documentclass: report
    papersize: a4
    geometry:
      - top=20mm
      - bottom=20mm
      - left=30mm
      - right=20mm
    toc: true
    toc-depth: 3
    number-sections: false
    colorlinks: true
    linestretch: 1.5
    fontsize: 13pt
